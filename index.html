<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ovia Sport · Aquatic Club Pro</title>
    <!-- Tailwind CSS CDN Config (Mode Sombre/Clair par classe CSS) -->
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class'
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwind) {
        window.tailwind.config = {
          darkMode: 'class'
        };
      }
      // Application immédiate du thème anti-flash avant affichage
      (function() {
        try {
          var saved = localStorage.getItem('ovia_theme') || localStorage.getItem('app-theme') || 'light';
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
